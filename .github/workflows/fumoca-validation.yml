name: FUMOCA validation

on:
  push:
    branches: [main, "feat/**", "feature/**", "platform-integration-audit", "whole-platform-reference-audit", "lidar-splat-integrity-cleanup", "lichtfeld-inspired-clean-run"]
  pull_request:
    branches: [main, "feature/**"]
  workflow_dispatch:

jobs:
  static-and-glb-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install animation runtime dependencies
        run: npm install --no-save --no-package-lock three@0.180.0 @dimforge/rapier3d-compat@0.21.0
      - name: Check 4D Gaussian sequence module syntax
        run: node --input-type=module --check < js/modules/fourd-sequence.js
      - name: Run animation and 4D sequence test suite
        run: node scripts/run-anim-tests.mjs
      - name: Test 4D capture reconstruction job contract
        run: node --experimental-default-type=module tests/fourd-job-contract.test.mjs
      - name: Test completed 4D NIF sequence assembly
        run: node --experimental-default-type=module tests/fourd-sequence-library.test.mjs
      - name: Test manual Gaussian editor and NIF round trip
        run: node --experimental-default-type=module engine-next/tests/manual-gaussian-editor.integration.test.mjs
      - name: Test proxy deformation transfer to Gaussian records
        run: node --experimental-default-type=module tests/nif-proxy-deformer.test.mjs
      - name: Test native Gaussian animation tracks
        run: node --experimental-default-type=module tests/nif-gaussian-animator.test.mjs
      - name: Test native Gaussian viewer playback controls
        run: node --experimental-default-type=module tests/nif-viewer-gaussian-timeline.test.mjs
      - name: Test NIF binary format round trips
        run: node --experimental-default-type=module engine-next/tests/format.test.mjs
      - name: Check 4D capture and NIF worker integration
        run: |
          node --input-type=module --check < js/modules/fourd-capture.js
          node --input-type=module --check < js/modules/fourd-job-contract.js
          node --input-type=module --check < js/modules/fourd-sequence-library.js
          node --input-type=module --check < engine-next/animation/NIFProxyDeformer.js
          node --input-type=module --check < engine-next/animation/NIFGaussianAnimator.js
          node --input-type=module --check < engine-next/animation/NIFManualGaussianDeformAuthor.js
          node --input-type=module --check < engine-next/animation/NIFManualAnimationExport.js
          node --input-type=module --check < engine-next/editor/manual-gaussian-deformation-lab.js
          node --input-type=module --check < engine-next/viewer-src/renderer/NIFRenderer.js
          node --input-type=module --check < engine-next/viewer-src/NIFViewer.js
          node --input-type=module --check < engine-next/editor/NIFGaussianTimelinePanel.js
          node --input-type=module --check < engine-next/editor/gaussian-animation-preview.js
          node --input-type=module --check < engine-next/format/NIFSpec.js
          node --input-type=module --check < scripts/add-gaussian-animation-demo.mjs
          grep -q "bindGaussianAnimation" engine-next/viewer-src/renderer/NIFRenderer.js
          grep -q "updateGaussianAnimation" engine-next/viewer-src/renderer/NIFRenderer.js
          grep -q "bindProxyDeformation" engine-next/viewer-src/renderer/NIFRenderer.js
          grep -q "updateProxyDeformation" engine-next/viewer-src/renderer/NIFRenderer.js
          python -m py_compile engine-next/reconstruction/pipeline.py
          grep -q "hdr\[4\], hdr\[5\] = 1, 2" engine-next/reconstruction/pipeline.py
          grep -q "from('nif-videos').upload" js/modules/fourd-capture.js
          grep -q "from('reconstruction_jobs').insert" js/modules/fourd-capture.js
          grep -q "motion_sequence_id" js/modules/fourd-job-contract.js
          grep -q "_extract_frames(raw, capture_mode, meta)" engine-next/reconstruction/pipeline.py
          grep -q "Extracted.*motion-selected frames" engine-next/reconstruction/pipeline.py
          grep -q "camera_sync_warning" js/modules/fourd-capture.js
          grep -q "motionSequence" engine-next/reconstruction/pipeline.py
          grep -q "fourd-sequence-library.js" viewer.html
          grep -q "_fumocaLoadMotionSequenceNif" js/modules/viewer.js
          grep -q "FourDSequence.create(manifest, adapter" js/modules/fourd-sequence-library.js
          grep -q "fumoca4dSequenceControls" js/modules/fourd-sequence-library.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check whole-platform integration audit
        run: test -s docs/PLATFORM_INTEGRATION_AUDIT.md && grep -q "Acceptance gates for a clean release" docs/PLATFORM_INTEGRATION_AUDIT.md
      - name: Check Studio JavaScript syntax
        run: node --check js/modules/image-to-splat-studio.js
      - name: Check viewer ES module syntax
        run: node --input-type=module --check < js/modules/viewer.js
      - name: Check presentation module syntax
        run: |
          node --input-type=module --check < js/modules/adaptive-presentation.js
          node --input-type=module --check < js/modules/poster-composer.js
          node --input-type=module --check < js/modules/poster-editor-overlay.js
          node --input-type=module --check < js/modules/present-magazine-text.js
          node --input-type=module --check < js/modules/present-viewer.js
          node --input-type=module --check < js/modules/poster-assets.js
          node --input-type=module --check < js/modules/present-tab.js
      - name: Check persistence-sensitive editor modules
        run: |
          node --input-type=module --check < js/modules/edit-engine.js
          node --input-type=module --check < js/modules/splat-edit-engine.js
          node --input-type=module --check < js/modules/hotspot-persist.js
          node --input-type=module --check < js/modules/motion-states.js
          node --input-type=module --check < js/modules/notifications.js
          node --input-type=module --check < js/modules/upload-page.js
          node --input-type=module --check < js/modules/feed.js
          node --input-type=module --check < js/modules/profile.js
      - name: Check editor persistence contract
        run: |
          ! grep -nE "from\\('(nifs|splats)'\\)" js/modules/edit-engine.js js/modules/splat-edit-engine.js
          grep -q "from('nif_files')" js/modules/edit-engine.js
          grep -q "from('nif_files')" js/modules/splat-edit-engine.js
          ! grep -nE "from\\('(splats)'\\)" js/modules/hotspot-persist.js js/modules/motion-states.js
          grep -q "from('nif_files')" js/modules/hotspot-persist.js
          grep -q "from('nif_files')" js/modules/motion-states.js
          grep -q "fumoca:motionStateSaveFailed" js/modules/motion-states.js
          ! grep -nE "from\\('(processing_jobs)'\\)" js/modules/notifications.js
          grep -q "from('reconstruction_jobs')" js/modules/notifications.js
          grep -q "splat_to_nif" js/modules/upload-page.js
          grep -q "ply_to_nif" js/modules/upload-page.js
          grep -q "inspectPlyAttributes" js/modules/upload-page.js
          grep -q "discarded_attributes" js/modules/upload-page.js
          grep -q "higher_order_sh_discarded_colour_approximation" js/modules/ply-conversion-metadata.js
          grep -q "conversion: outputBuffer ? {" js/modules/upload-page.js
          grep -q "gpu_required: false" js/modules/upload-page.js
          grep -q "source_r2_key" js/modules/upload-page.js
          grep -q "Open in Studio" js/modules/upload-page.js
          grep -q "r2.from('thumbnails').upload(thumbPath" js/modules/upload-page.js
          ! grep -q "r2.from('nif-files').upload(thumbPath" js/modules/upload-page.js
          grep -q "storage did not return a file key and URL" js/modules/upload-page.js
          ! grep -n "nif_file_id" js/modules/feed.js
          grep -q "post.meta?.source_r2_key" js/modules/feed.js
          grep -q "meta.source_capture?.r2_key" js/modules/profile.js
          grep -q "from('reconstruction_jobs')" js/modules/feed.js
          grep -q "row.job_id || row.id" js/modules/feed.js
          grep -q "row.status = 'needs_retry'" js/modules/feed.js
          grep -q "needs_retry" js/modules/feed.js
          grep -q "jobsById.get" js/modules/profile.js
          grep -q "row.job_id ? 'needs_retry' : 'done'" js/modules/profile.js
          grep -q "viewer.html?nifId=" js/modules/profile.js
          grep -q "source_capture: { r2_key: fileKey" js/modules/upload-page.js
          grep -q "r2_key: filePath" js/modules/upload-page.js
          grep -q "capture_thumbnail_r2_key: uploadedThumbnail.fileKey" js/modules/upload-page.js
          grep -q "post.meta?.capture_thumbnail_r2_key" js/modules/feed.js
          grep -q "meta.capture_thumbnail_r2_key" js/modules/profile.js
          grep -q "meta.capture_thumbnail_r2_key" js/modules/viewer.js
          grep -q "meta.source_capture?.r2_key" js/modules/viewer.js
          grep -q "if (!currentRecord.r2_key || !currentRecord.user_id)" js/modules/viewer.js
          grep -q "not a saved NIF artifact" js/modules/viewer.js
          ! grep -n "eq('nif_id'" js/modules/viewer.js
      - name: Check inline Studio script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("edit.html").read_text(encoding="utf-8")
          matches = re.findall(r"<script\b([^>]*)>(.*?)</script\s*>", html, re.I | re.S)
          scripts = [(attrs, source) for attrs, source in matches if not re.search(r"\bsrc\s*=", attrs, re.I) and not re.search(r"\btype\s*=\s*['\"]?(?:importmap|application/json)", attrs, re.I)]
          if not scripts:
              raise SystemExit("No inline Studio scripts found")
          out = Path("/tmp/fumoca-inline-scripts")
          out.mkdir(exist_ok=True)
          for i, (attrs, source) in enumerate(scripts):
              suffix = ".mjs" if re.search(r"type\s*=\s*['\"]?module", attrs, re.I) else ".js"
              (out / f"script-{i}{suffix}").write_text(source, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline Studio scripts for syntax validation")
          PY
          for script in /tmp/fumoca-inline-scripts/script-*; do node --check "$script"; done
      - name: Guard immediate transform attachment after Add Splat
        run: |
          grep -q "Rebuild the source-index map and attach the gizmo after the appended layer" edit.html
          grep -q "refreshTransformSourceMap();" edit.html
          grep -q "syncTransformGizmo();" edit.html
          grep -q "if (!L.visible && S.activeLayerId === L.id)" edit.html
      - name: Guard multi-splat object selection and transforms
        run: |
          grep -Fq 'Added ${file.name} as a separate layer' edit.html
          grep -q "S.layers.push({" edit.html
          grep -q "mask: newMask" edit.html
          grep -q "const selectedCount = selectedPointCount();" edit.html
          grep -q "const canTransform = S.transformScope === 'scene' ? count > 0 : selectedCount > 0" edit.html
          grep -q "const useSelection = S.transformScope === 'selection'" edit.html
          grep -q "if (useSelection && !selectedPointCount()) return indices" edit.html
      - name: Guard independent subject transform attachment
        run: |
          grep -q "Selecting a layer must select only its live, visible points" edit.html || grep -q "Selecting a layer must select only its live, visible points and attach" edit.html
          grep -q "syncTransformGizmo();" edit.html
          grep -q "Selected subject:" edit.html
      - name: Guard click-to-select subject workflow
        run: |
          grep -q "function selectSubjectAtScreen" edit.html
          grep -q "Selected subject:" edit.html
          grep -q "if (dx <= 7 && dy <= 7)" edit.html
          grep -q "function selectSubjectAtScreen" edit.html
      - name: Guard R2 delete ownership boundaries
        run: |
          grep -q "principal.kind !== 'server-to-server'" cloudflare/workers/r2-storage.js
          grep -q "const ownedPrefix = \`\${principal.id}/\`;" cloudflare/workers/r2-storage.js
          grep -q "const posterPrefix = \`poster-assets/\${principal.id}/\`;" cloudflare/workers/r2-storage.js
          grep -q "userOwnsNifStorageKey(principal, fileKey, env)" cloudflare/workers/r2-storage.js
          grep -q "Forbidden — you can only delete files owned by your account" cloudflare/workers/r2-storage.js
          grep -q "const assetPath = \`\${user.id}/\${splatId || 'new'}\`;" js/modules/publish-to-fumoca.js
      - name: Test PLY conversion fidelity disclosure
        run: |
          node --input-type=module --check < js/modules/ply-conversion-metadata.js
          node --experimental-default-type=module tests/ply-conversion-metadata.mjs
      - name: Test Poster Composer model and responsive layout
        run: node --experimental-default-type=module tests/poster-composer.mjs
      - name: Test Studio poster editor overlay geometry
        run: node --experimental-default-type=module tests/poster-editor-overlay.mjs
      - name: Test responsive editorial typography and poster clipping contract
        run: node --experimental-default-type=module tests/editorial-text-layout.mjs
      - name: Test editorial preset coverage and saved text controls
        run: node --experimental-default-type=module tests/editorial-presets.mjs
      - name: Test responsive editorial image layer contract
        run: node --experimental-default-type=module tests/editorial-layers.mjs
      - name: Test poster background and supporting image contract
        run: node --experimental-default-type=module tests/poster-assets.mjs
      - name: Test composed poster capture includes text and supporting images
        run: node --experimental-default-type=module tests/poster-capture-composition.mjs
      - name: Test mocked poster cloud persistence and rollback
        run: node --experimental-default-type=module tests/poster-cloud-persistence.mjs
      - name: Test Adaptive Presentation Engine framing and responsive sizing
        run: node --experimental-default-type=module tests/adaptive-presentation.mjs
      - name: Test live poster camera-plane transforms
        run: node --experimental-default-type=module tests/poster-live-transform.mjs
      - name: Test poster viewer integration across rendering paths
        run: node --experimental-default-type=module tests/poster-viewer-integration.mjs
      - name: Test responsive poster viewport geometry
        run: node --experimental-default-type=module tests/poster-viewport.mjs
      - name: Test Studio viewport toolbar wiring
        run: node tests/viewport-tools.mjs
      - name: Test live transformed splat encoding and persistence
        run: node tests/live-edit-encoding.mjs
      - name: Test stable poster zoom and scene framing
        run: node tests/poster-viewport.mjs
      - name: Install browser test runner
        run: npm install --no-save playwright@1.58.2
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Test manual Gaussian Lab end-to-end in Chromium
        run: node --experimental-default-type=module tests/browser/manual-gaussian-lab.browser.mjs
      - name: Test free 3D poster trackball interactions in Chromium
        run: node tests/browser/poster-trackball.browser.mjs
      - name: Test poster asset interactions in Chromium
        run: node tests/browser/poster-assets.browser.mjs
      - name: Test freely positioned poster text in Chromium
        run: node tests/browser/poster-text.browser.mjs
      - name: Test public viewer restores saved poster compositions in Chromium
        run: node tests/browser/poster-viewer-restore.browser.mjs
      - name: Test poster motion levels and stable yaw in Chromium
        run: node tests/browser/poster-motion.browser.mjs
      - name: Test poster scene object management in Chromium
        run: node tests/browser/poster-scene-manager.browser.mjs
      - name: Test poster visual layer stacking in Chromium
        run: node tests/browser/poster-layer-stack.browser.mjs
      - name: Test Studio poster editor overlay interactions in Chromium
        run: node tests/browser/poster-editor-overlay.browser.mjs
      - name: Test industry layer model
        run: node --experimental-default-type=module tests/industry-layer.mjs
      - name: Test viewer Gaussian scale encoding
        run: node --experimental-default-type=module tests/viewer-scale.mjs
      - name: Test R2 worker auth boundaries
        run: node --experimental-default-type=module cloudflare/tests/auth.test.mjs
      - name: Test engine-next NIF format, graph and edit round-trip
        run: |
          node --experimental-default-type=module engine-next/tests/format.test.mjs
          node --experimental-default-type=module engine-next/tests/graph.test.mjs
          node --experimental-default-type=module engine-next/tests/nif-edit-roundtrip.test.mjs
      - name: Test backend API rate limiter
        run: node --experimental-default-type=module engine-next/backend-api/tests/rateLimit.test.mjs
      - name: Test engine-next physics
        run: python engine-next/tests/physics.test.py
      - name: Test URL-scheme and HTML-injection guards (hotspots, tours, ads, commerce, audio, widgets, persisted UI)
        run: |
          node --experimental-default-type=module tests/safe-url.test.mjs
          node --experimental-default-type=module tests/tour-url-security-contract.mjs
          node --experimental-default-type=module tests/ad-url-security-contract.mjs
          node --experimental-default-type=module tests/commerce-teaser-security-contract.mjs
          node --experimental-default-type=module tests/audio-url-security-contract.mjs
          node --experimental-default-type=module tests/mobile-asset-html-security.mjs
          node --experimental-default-type=module tests/persisted-ui-xss-contract.mjs
      - name: Test Studio Spark fallback (no blank viewport when Spark fails) in Chromium
        run: node tests/browser/spark-fallback.browser.mjs
      - name: Test CPU-only splat to NIF conversion
        run: node --experimental-default-type=module tests/splat-to-nif-smoke.mjs
      - name: Test whole-platform audit contract
        run: node --test tests/whole-platform-audit.test.mjs
      - name: Check LiDAR importer ES module syntax
        run: node --input-type=module --check < js/modules/lidar-import.js
      - name: Check upload page ES module syntax
        run: node --input-type=module --check < js/modules/upload-page.js
      - name: Test LiDAR intensity normalization
        run: node --test tests/lidar-intensity.test.mjs
      - name: Test header-aware LiDAR text import
        run: node --test tests/lidar-text-parser.test.mjs
      - name: Test uncompressed LAS parser fixtures
        run: node --test tests/lidar-las-parser.test.mjs
      - name: Test portable PLY coordinate metadata
        run: node --test tests/lidar-coordinate-metadata.test.mjs
      - name: Test point-cloud downsampling alignment
        run: node --test tests/lidar-cloud-utils.test.mjs
      - name: Test LiDAR preflight quality gates
        run: node --test tests/lidar-quality-report.test.mjs
      - name: Test Studio LiDAR visibility and validation gates
        run: node --test tests/studio-lidar-visible.test.mjs
      - name: Check standalone LiDAR report syntax
        run: node --input-type=module --check < js/modules/lidar-quality-report.mjs
      - name: Compile Kaggle preflight script
        run: python -m py_compile kaggle/mesh2splat_preflight.py
      - name: Install preflight dependencies
        run: python -m pip install --disable-pip-version-check numpy trimesh
      - name: Build a tiny GLB fixture and test preflight
        shell: bash
        run: |
          python - <<'PY'
          import trimesh
          mesh = trimesh.creation.box(extents=(1.0, 2.0, 3.0))
          scene = trimesh.Scene(mesh)
          scene.export("validation-fixture.glb")
          PY
          python kaggle/mesh2splat_preflight.py validation-fixture.glb --report preflight-report.json
          python - <<'PY'
          import json
          with open("preflight-report.json", encoding="utf-8") as f:
              report = json.load(f)
          assert report["status"] == "preflight_passed_conversion_not_run", report
          assert report["geometry"]["triangles"] > 0, report
          assert report["gates"]["mesh2splat_conversion_run"] is False, report
          print("GLB preflight fixture passed; conversion is intentionally not run.")
          PY
