name: Vendor 3D libraries
on:
  push:
    paths: ['vendor/VERSIONS.json', 'scripts/vendor-libs.mjs', '.github/workflows/vendor-libs.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/vendor-libs.mjs
      - name: Check Spark's entry module is there
        run: ls vendor/sparkjsdev-spark/2.4.0/dist/ && test -f vendor/sparkjsdev-spark/2.4.0/dist/spark.module.js
      - name: Commit vendored files
        run: |
          git config user.name "fumoca-vendor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f vendor
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Vendor 3D libraries (three, Spark, Rapier) for self-hosting"
          git push
