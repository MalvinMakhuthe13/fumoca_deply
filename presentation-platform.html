<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>FUMOCA · Presentation Platform</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/nav.css">
<script src="config.js"></script>
<script src="js/modules/nav.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05070b;--surface:#0b0e14;--panel:#11141c;--border:rgba(255,255,255,.1);
  --text:#fff;--muted:rgba(255,255,255,.55);--dim:rgba(255,255,255,.35);
  --neon:#c8ff00;--font:'DM Sans',system-ui,sans-serif;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit}

#app{display:flex;height:100%;width:100%;padding-left:0}
body.fnav-has-nav #app{margin-left:0}

/* Left controls */
#sidebar{
  width:320px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;
}
.header{
  padding:16px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.logo{font-weight:800;color:var(--neon);letter-spacing:.02em}
.header span{font-size:13px;color:var(--muted)}

.section{padding:16px 18px;border-bottom:1px solid var(--border)}
.section h3{
  font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:12px;
}
.row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chip{
  flex:1;min-width:64px;padding:8px 6px;border-radius:10px;text-align:center;
  background:rgba(255,255,255,.06);border:1px solid var(--border);font-size:12px;font-weight:600;
  transition:all .15s;
}
.chip.active{background:rgba(200,255,0,.15);border-color:var(--neon);color:var(--neon)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.field input[type="range"]{width:100%;accent-color:var(--neon)}
.field .val{float:right;font-size:11px;color:var(--neon);font-weight:700}
.mat-swatch{
  width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer;
  transition:transform .15s;
}
.mat-swatch.active{border-color:var(--neon);transform:scale(1.08)}
.btn{
  width:100%;padding:12px;border-radius:12px;font-weight:800;font-size:14px;
  background:var(--neon);color:#05070b;margin-top:8px;
}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--border)}
.logo-preview{
  width:100%;height:80px;border-radius:10px;background:rgba(255,255,255,.04);
  border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;
  overflow:hidden;margin-bottom:8px;
}
.logo-preview img{max-width:100%;max-height:100%;object-fit:contain}

/* Main stage */
#stage{
  flex:1;position:relative;background:#000;min-width:0;
}
#canvasHost{position:absolute;inset:0}
#canvasHost canvas{display:block;width:100%;height:100%}

/* Right views */
#views{
  width:180px;background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;padding:12px;gap:10px;overflow-y:auto;
}
.view-card{
  border-radius:12px;overflow:hidden;border:1px solid var(--border);cursor:pointer;
  background:#080a10;aspect-ratio:1;position:relative;
}
.view-card span{
  position:absolute;bottom:6px;left:0;right:0;text-align:center;
  font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
}
.view-card.active{border-color:var(--neon)}

/* Bottom timeline */
#timeline{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  width:min(640px,70%);height:48px;background:rgba(11,14,20,.85);
  border:1px solid var(--border);border-radius:24px;display:flex;align-items:center;
  padding:0 16px;gap:8px;backdrop-filter:blur(12px);
}
#angleLabel{font-size:12px;font-weight:700;color:var(--neon);min-width:48px}
#angleSlider{flex:1;accent-color:var(--neon)}

#status{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  font-size:13px;color:var(--muted);background:rgba(0,0,0,.5);padding:6px 12px;border-radius:99px;
}

@media (max-width: 1100px) {
  #views { display: none; }
  #sidebar { width: 280px; }
}
@media (max-width: 800px) {
  #app { flex-direction: column; }
  #sidebar { width: 100%; height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
  #stage { flex: 1; min-height: 50vh; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="header">
      <span class="logo">FUMOCA</span>
      <span>Presentation Platform</span>
    </div>

    <div class="section">
      <h3>Load Splat</h3>
      <input type="file" id="fileInput" accept=".splat,.ply,.ksplat" style="display:none">
      <button class="btn ghost" id="loadFileBtn">Upload .splat / .ply</button>
      <button class="btn ghost" id="loadFromLibraryBtn" style="margin-top:6px">From My Splats</button>
      <div style="font-size:11px;color:var(--dim);margin-top:8px" id="loadedName">No splat loaded</div>
    </div>

    <div class="section">
      <h3>Presentation Base</h3>
      <div class="row" id="shapeRow">
        <button class="chip active" data-shape="circle">Circle</button>
        <button class="chip" data-shape="square">Square</button>
        <button class="chip" data-shape="rect">Rectangle</button>
      </div>
      <div class="field">
        <label>Width <span class="val" id="widthVal">600</span> mm</label>
        <input type="range" id="widthRange" min="200" max="1200" value="600">
      </div>
      <div class="field">
        <label>Height <span class="val" id="heightVal">80</span> mm</label>
        <input type="range" id="heightRange" min="20" max="200" value="80">
      </div>
      <div class="field">
        <label>Edge radius <span class="val" id="edgeVal">20</span> mm</label>
        <input type="range" id="edgeRange" min="0" max="60" value="20">
      </div>
    </div>

    <div class="section">
      <h3>Material</h3>
      <div class="row" id="matRow">
        <div class="mat-swatch active" data-mat="wood" style="background:linear-gradient(135deg,#8B4513,#D2691E)" title="Wood"></div>
        <div class="mat-swatch" data-mat="black" style="background:#111" title="Black"></div>
        <div class="mat-swatch" data-mat="white" style="background:#eee" title="White"></div>
        <div class="mat-swatch" data-mat="metal" style="background:linear-gradient(135deg,#aaa,#666)" title="Metal"></div>
        <div class="mat-swatch" data-mat="glass" style="background:linear-gradient(135deg,#aee,#6cc);opacity:.7" title="Glass"></div>
      </div>
    </div>

    <div class="section">
      <h3>Logo (Underside)</h3>
      <div class="logo-preview" id="logoPreview"><span style="font-size:11px;color:var(--dim)">No logo</span></div>
      <input type="file" id="logoInput" accept="image/*" style="display:none">
      <button class="btn ghost" id="uploadLogoBtn">Upload logo</button>
      <button class="btn ghost" id="clearLogoBtn" style="margin-top:6px">Remove</button>
      <div class="field" style="margin-top:12px">
        <label>Logo size <span class="val" id="logoSizeVal">400</span> mm</label>
        <input type="range" id="logoSizeRange" min="100" max="800" value="400">
      </div>
    </div>

    <div class="section">
      <button class="btn" id="applyBtn">Apply to Scene</button>
    </div>
  </aside>

  <div id="stage">
    <div id="canvasHost"></div>
    <div id="status">Drag to orbit · Scroll to zoom · Flip to see logo</div>
    <div id="timeline">
      <span id="angleLabel">0°</span>
      <input type="range" id="angleSlider" min="0" max="360" value="0">
    </div>
  </div>

  <aside id="views">
    <div class="view-card active" data-view="front"><span>Front</span></div>
    <div class="view-card" data-view="side"><span>Side</span></div>
    <div class="view-card" data-view="bottom"><span>Bottom</span></div>
    <div class="view-card" data-view="back"><span>Back</span></div>
  </aside>
</div>

<script type="module" src="js/modules/presentation-platform.js"></script>
</body>
</html>
