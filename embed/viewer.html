<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FUMOCA Embed</title>
  <script src="../config.js"></script>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#05070b;overflow:hidden}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <!--
    Canonical embed entry.
    Prefer embed/player.html for the full social chrome.
    This file keeps old iframe URLs working and forwards query params.
  -->
  <script>
    (function () {
      const q = location.search || '';
      // Social player is the default experience
      location.replace('./player.html' + q);
    })();
  </script>
  <noscript>
    <p style="color:#fff;font:14px sans-serif;padding:24px">
      JavaScript is required.
      <a href="./player.html" style="color:#c8ff00">Open player</a>
    </p>
  </noscript>
</body>
</html>
