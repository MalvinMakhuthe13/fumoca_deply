<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>FUMOCA Dynamic Physics Acceptance</title>
<script type="importmap">{"imports":{"@dimforge/rapier3d-compat":"https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"}}</script>
<style>body{font:13px/1.4 monospace;background:#111;color:#eee;padding:16px}.pass{color:#8f8}.fail{color:#f66;font-weight:bold}</style>
</head>
<body>
<pre id="out">Loading...</pre>
<script type="module">
import '../../js/modules/anim-physics.js';
const out = document.getElementById('out');
const lines = [];
let failed = 0;
function log(s, ok) {
  const cls = ok === false ? 'fail' : ok === true ? 'pass' : '';
  lines.push(cls ? `<span class="${cls}">${s}</span>` : s);
  if (ok === false) failed++;
  out.innerHTML = lines.join('\n');
}
function assert(cond, msg) { log((cond ? 'PASS: ' : 'FAIL: ') + msg, !!cond); }

// Geometry:
// Floor: box halfExtents 1 x 0.05 x 1, top at y=0.05
// Bottle: capsule radius 0.10, height 0.30 (half-height 0.15)
// Resting centre ≈ 0.05 + 0.15 + 0.10 = 0.30
// Tolerance: 0.08 m
const FLOOR_HALF_Y = 0.05;
const BOTTLE_RADIUS = 0.10;
const BOTTLE_HEIGHT = 0.30;
const EXPECTED_REST_Y = FLOOR_HALF_Y + BOTTLE_HEIGHT / 2 + BOTTLE_RADIUS;
const REST_TOLERANCE = 0.08;

const Physics = window.FumocaPhysics;
const init = await Physics.initRapier();
assert(init.ok === true, 'Rapier initialized');
assert(Physics.getBackend() === 'rapier', 'Backend is rapier');

const g = Physics.getGravity();
assert(g && Math.abs(g.y + 9.81) < 0.01, 'Gravity is -9.81');

Physics.createCollider({ id: 'floor', type: 'box', bodyType: 'static', halfExtents: { x: 1, y: FLOOR_HALF_Y, z: 1 }, owner: { kind: 'component', objectId: 'cooler', componentId: 'base' } });
Physics.createCollider({ id: 'bottle', type: 'capsule', bodyType: 'dynamic', mass: 0.5, radius: BOTTLE_RADIUS, height: BOTTLE_HEIGHT, owner: { kind: 'component', objectId: 'bottle', componentId: 'body' } });
Physics.syncFromEvaluation({
  objects: {
    cooler: { base: { pos: { x: 0, y: 0, z: 0 }, rot: { x: 0, y: 0, z: 0 } } },
    bottle: { body: { pos: { x: 0, y: 1.2, z: 0 }, rot: { x: 0, y: 0, z: 0 } } },
  },
});

const start = Physics.getDynamicPose('bottle');
assert(start && start.position.y > 1, 'Bottle starts above floor');

for (let i = 0; i < 3; i++) Physics.step(1/60);
const early = Physics.getDynamicPose('bottle');
assert(early && early.linvel.y < 0, 'Downward velocity after 3 frames');
assert(early && early.position.y < start.position.y, 'Position decreased after 3 frames');

for (let i = 0; i < 180; i++) Physics.step(1/60);
const settled = Physics.getDynamicPose('bottle');
assert(settled && settled.position.y > FLOOR_HALF_Y, 'Bottle remains above floor');
assert(settled && Math.abs(settled.position.y - EXPECTED_REST_Y) < REST_TOLERANCE, 'Bottle near expected rest Y=' + EXPECTED_REST_Y.toFixed(2));
assert(settled && Math.abs(settled.linvel.y) < 0.15, 'Velocity near zero');

const reset = Physics.reset();
const after = Physics.getDynamicPose('bottle');
assert(reset.ok && after && Math.abs(after.position.y - start.position.y) < 0.05, 'Reset restores position');
assert(after && Math.abs(after.linvel.y) < 0.01 && Math.abs(after.linvel.x) < 0.01, 'Reset clears linear velocity');

const baseBodies = Physics.getBodyCount();
const baseCols = Physics.getColliderCount();
Physics.setEnabled('bottle', false);
assert(Physics.getBodyCount() === baseBodies - 1, 'Disable decreases body count');
assert(Physics.getColliderCount() === baseCols - 1, 'Disable decreases collider count');
Physics.setEnabled('bottle', true);
assert(Physics.getBodyCount() === baseBodies, 'Re-enable restores body count');
assert(Physics.getColliderCount() === baseCols, 'Re-enable restores collider count');
for (let i = 0; i < 10; i++) { Physics.setEnabled('bottle', false); Physics.setEnabled('bottle', true); }
assert(Physics.getBodyCount() === baseBodies, '10 cycles body count stable');
assert(Physics.getColliderCount() === baseCols, '10 cycles collider count stable');

const result = {
  status: failed === 0 ? 'PASS' : 'FAIL',
  passed: lines.filter(l => l.includes('PASS:')).length,
  failed,
  backend: Physics.getBackend(),
  rapierReady: Physics.isRapierReady(),
  gravity: Physics.getGravity(),
  bodyCount: Physics.getBodyCount(),
  colliderCount: Physics.getColliderCount(),
  expectedRestY: EXPECTED_REST_Y,
  errors: [],
};
window.PHYSICS_ACCEPTANCE = result;
log('FINAL: ' + result.status, failed === 0);
</script>
</body>
</html>
