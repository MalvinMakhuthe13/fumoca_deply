<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Sequence harness</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
window.THREE = THREE;
await import('../../js/modules/anim-joint-eval.js');
const { default: Objects } = await import('../../js/modules/anim-object.js');
const { default: Master } = await import('../../js/modules/anim-master.js');
const failures = [];
const obj = Objects.createObject('pair', 'Pair');
const root = Objects.addComponent('pair', 'Root', 'fixed');
root.local = { position: { x: 0, y: 0, z: 0 }, rotation: { x: 0, y: 0, z: 0, w: 1 } };
const head = Objects.addComponent('pair', 'Lamp head', 'hinge', root.id);
const body = Objects.addComponent('pair', 'Camera body', 'hinge', root.id);
for (const part of [head, body]) {
  Objects.defineJoint('pair', part.id, { kind: 'hinge', axis: { x: 1, y: 0, z: 0 }, limits: { min: 0, max: 1 } });
  part.local = { position: { x: 0, y: 0.2, z: 0 }, rotation: { x: 0, y: 0, z: 0, w: 1 } };
  Objects.setJointValue('pair', part.id, 0);
}
Objects.captureKeyframe('pair', 0);
const rootNode = new THREE.Object3D();
const headNode = new THREE.Object3D();
const bodyNode = new THREE.Object3D();
rootNode.add(headNode); rootNode.add(bodyNode);
Master.addObject(Objects.get('pair'));
Master.setObjectBinding('pair', new Map([[root.id, rootNode], [head.id, headNode], [body.id, bodyNode]]));
Master.evaluate(0);
Master.playSequence([
  { objectId: 'pair', componentId: head.id, to: 1, duration: 0.05, endTime: null },
  { objectId: 'pair', componentId: body.id, to: 1, duration: 0.05, endTime: null },
]);
const started = performance.now();
function tick() {
  if (Master.gesturesIdle()) {
    const headMoved = Math.abs(headNode.quaternion.x) > 0.2 || Math.abs(headNode.rotation.x) > 0.2;
    const bodyMoved = Math.abs(bodyNode.quaternion.x) > 0.2 || Math.abs(bodyNode.rotation.x) > 0.2;
    if (!headMoved) failures.push('head did not move');
    if (!bodyMoved) failures.push('body did not move');
    window.__sequence = { ok: failures.length === 0, failures, ms: performance.now() - started };
    return;
  }
  if (performance.now() - started > 4000) {
    window.__sequence = { ok: false, failures: ['timed out'].concat(failures) };
    return;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body></html>
