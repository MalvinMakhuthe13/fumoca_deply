<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>FUMOCA Physics Master Acceptance</title>
<script type="importmap">{"imports":{"@dimforge/rapier3d-compat":"https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"}}</script>
<style>
body { font: 13px/1.4 monospace; background: #111; color: #eee; padding: 16px; }
.pass { color: #8f8; } .fail { color: #f66; font-weight: bold; }
</style>
</head>
<body>
<pre id="out">Loading...</pre>
<script type="module">
const out = document.getElementById('out');
const assertions = [];
const errors = [];
let passed = 0, failed = 0, backend = 'unknown', rapierReady = false;
window.addEventListener('error', e => errors.push('window.error: ' + (e.message || e.error?.message || 'unknown')));
window.addEventListener('unhandledrejection', e => errors.push('unhandledrejection: ' + (e.reason?.message || String(e.reason))));
function render() {
  out.innerHTML = assertions.map(a => '<span class="' + (a.ok ? 'pass' : 'fail') + '">' +
    (a.ok ? 'PASS: ' : 'FAIL: ') + a.name.replaceAll('&','&amp;').replaceAll('<','&lt;') + '</span>').join('\n') +
    '\n\n' + (window.__PHYSICS_ACCEPTANCE__?.status || 'RUNNING');
}
function assert(ok, name) {
  assertions.push({ ok: !!ok, name: String(name) });
  if (ok) passed++; else failed++;
  render();
  return !!ok;
}
function counts() { return window.FumocaPhysics.getRuntimeCounts(); }
function near(a,b,e=1e-3) { return Number.isFinite(a) && Math.abs(a-b) <= e; }
function sameQuat(a,b,e=1e-4) {
  if (!a || !b) return false;
  const dot = a.x*b.x+a.y*b.y+a.z*b.z+a.w*b.w;
  return Math.abs(Math.abs(dot)-1) <= e;
}
try {
  await import('../../js/modules/anim-master.js');
  await import('../../js/modules/anim-physics.js');
  await import('../../js/modules/anim-object.js');
  const Physics = window.FumocaPhysics, Master = window.FumocaMaster, Objects = window.FumocaObjectAnim;
  if (!Physics || !Master || !Objects) throw new Error('Required FUMOCA modules did not expose globals');

  const init = await Physics.initRapier();
  backend = Physics.getBackend();
  rapierReady = Physics.isRapierReady() === true;
  assert(init.ok === true, 'Rapier WASM initialization succeeded: ' + JSON.stringify(init));
  assert(backend === 'rapier', 'Active backend is Rapier');
  assert(rapierReady, 'Rapier WASM readiness is true');

  const cooler = Objects.createObject('cooler', 'Cooler');
  const base = Objects.addComponent('cooler', 'Base', 'transform');
  const lid = Objects.addComponent('cooler', 'Lid', 'hinge', base.id);
  Objects.setComponentTransform('cooler', lid.id, { x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 0 }, 'closed');
  Objects.captureKeyframe('cooler', 0);
  Objects.setComponentTransform('cooler', lid.id, { x: 80, y: 0, z: 0 }, { x: 0, y: 0, z: 0 }, 'open');
  Objects.captureKeyframe('cooler', 2);
  const bottle = Objects.createObject('bottle', 'Bottle');
  const body = Objects.addComponent('bottle', 'Body', 'transform');
  Objects.setComponentTransform('bottle', body.id, { x: 0, y: 0, z: 0 }, { x: -0.6, y: 0.2, z: 0 });
  Objects.captureKeyframe('bottle', 0);
  Objects.setComponentTransform('bottle', body.id, { x: 0, y: 0, z: 0 }, { x: 0.1, y: 0.2, z: 0 });
  Objects.captureKeyframe('bottle', 2);
  Master.addObject(cooler); Master.addObject(bottle); Master.setDuration(2);

  Physics.createCollider({ id: 'base', type: 'box', bodyType: 'static', halfExtents: { x: .4, y: .3, z: .3 }, owner: { kind: 'component', objectId: 'cooler', componentId: base.id } });
  Physics.createCollider({ id: 'lid', type: 'box', bodyType: 'kinematic', halfExtents: { x: .4, y: .02, z: .3 }, localPosition: { x: 0, y: .3, z: 0 }, owner: { kind: 'component', objectId: 'cooler', componentId: lid.id } });
  Physics.createCollider({ id: 'bottle', type: 'capsule', bodyType: 'kinematic', radius: .04, height: .2, owner: { kind: 'component', objectId: 'bottle', componentId: body.id } });
  assert(Physics.list().length === 3, 'Exactly three collider definitions registered');

  function poseAt(t) {
    const ev = Master.evaluate(t);
    return { physics: ev?.physics, lid: Physics.getWorldPose('lid'), bottle: Physics.getWorldPose('bottle'), base: Physics.getWorldPose('base') };
  }
  const start = poseAt(0), open = poseAt(2), back = poseAt(0), forward = poseAt(2);
  const angle = 2 * Math.atan2(Math.abs(open.lid?.quaternion?.x || 0), Math.abs(open.lid?.quaternion?.w || 1)) * 180 / Math.PI;
  assert(near(angle, 80, .5), 'Lid quaternion represents 80 degrees (actual ' + angle.toFixed(3) + '°)');
  assert(near(start.bottle?.position?.x, -.6, .02), 'Bottle start position is -0.6');
  assert(near(open.bottle?.position?.x, .1, .02), 'Bottle end position is 0.1');
  assert(near(back.bottle?.position?.x, -.6, .02), 'Backward scrub restores bottle start');
  assert(near(forward.bottle?.position?.x, .1, .02), 'Forward scrub restores bottle end');
  assert(near(start.base?.position?.x, 0) && near(start.base?.position?.y, 0) && sameQuat(start.base?.quaternion, back.base?.quaternion), 'Static base position and rotation remain unchanged');
  assert(Array.isArray(forward.physics), 'Master.evaluate returns physics query results');

  // Exercise scaled primitives and unsupported geometry on the actual Rapier backend.
  Physics.createCollider({ id: 'accept_sphere', type: 'sphere', radius: .2, scale: { x: 2, y: 2, z: 2 }, owner: { kind: 'component', objectId: 'scaleSphere', componentId: 'body' } });
  Physics.createCollider({ id: 'accept_sphere_target', type: 'sphere', radius: .05, owner: { kind: 'component', objectId: 'scaleSphereTarget', componentId: 'body' } });
  Physics.createCollider({ id: 'accept_capsule', type: 'capsule', radius: .1, height: .4, scale: { x: 2, y: 1.5, z: 2 }, owner: { kind: 'component', objectId: 'scaleCapsule', componentId: 'body' } });
  Physics.createCollider({ id: 'accept_capsule_target', type: 'sphere', radius: .05, owner: { kind: 'component', objectId: 'scaleCapsuleTarget', componentId: 'body' } });
  Physics.createCollider({ id: 'accept_unsupported', type: 'convexHull', points: [], owner: { kind: 'component', objectId: 'unsupported', componentId: 'body' } });
  const shapeEval = { objects: {
    scaleSphere: { body: { pos: { x: 0, y: 0, z: 0 }, rot: { x: 0, y: 0, z: 0 } } },
    scaleSphereTarget: { body: { pos: { x: .35, y: 0, z: 0 }, rot: { x: 0, y: 0, z: 0 } } },
    scaleCapsule: { body: { pos: { x: 3, y: 0, z: 0 }, rot: { x: 0, y: 0, z: 0 } } },
    scaleCapsuleTarget: { body: { pos: { x: 3, y: .48, z: 0 }, rot: { x: 0, y: 0, z: 0 } } },
    unsupported: { body: { pos: { x: 0, y: 0, z: 0 }, rot: { x: 0, y: 0, z: 0 } } },
  } };
  Physics.syncFromEvaluation(shapeEval);
  const shapeHits = Physics.queryOverlaps();
  assert(shapeHits.some(h => [h.colliderA,h.colliderB].includes('accept_sphere')), 'Rapier scaled sphere effective radius overlaps target');
  assert(shapeHits.some(h => [h.colliderA,h.colliderB].includes('accept_capsule')), 'Rapier scaled capsule effective radius/height overlaps target');
  assert(!shapeHits.some(h => [h.colliderA,h.colliderB].includes('accept_unsupported')), 'Unsupported convex hull excluded from Rapier overlap results');
  for (const id of ['accept_sphere','accept_sphere_target','accept_capsule','accept_capsule_target','accept_unsupported']) Physics.removeCollider(id);
  poseAt(1);

  for (let i=0;i<8;i++) { poseAt(0); poseAt(2); poseAt(1); }
  const stableCounts = counts();
  assert(Physics.list().length === 3, 'Three collider definitions remain registered after repeated scrubbing');
  assert(stableCounts.bodies === 3 && stableCounts.colliders === 3, 'Rapier body/collider counts remain 3/3 after repeated scrubbing (actual ' + JSON.stringify(stableCounts) + ')');

  Physics.setEnabled('bottle', false); Master.evaluate(1);
  const disabledCounts = counts();
  assert(disabledCounts.bodies === 2 && disabledCounts.colliders === 2, 'Disabling bottle removes its Rapier body and collider');
  Physics.setEnabled('bottle', true); Master.evaluate(1);
  const enabledCounts = counts();
  assert(enabledCounts.bodies === 3 && enabledCounts.colliders === 3, 'Re-enabling bottle recreates exactly one Rapier body/collider');
  for (let i=0;i<4;i++) { Physics.setEnabled('bottle', false); Master.evaluate(1); Physics.setEnabled('bottle', true); Master.evaluate(1); }
  const cycleCounts = counts();
  assert(cycleCounts.bodies === 3 && cycleCounts.colliders === 3, 'Repeated enable/disable cycles do not leak Rapier bodies or colliders');

} catch (e) {
  errors.push('acceptance exception: ' + (e?.stack || e?.message || String(e)));
  failed++;
  assertions.push({ok:false,name:'Harness completed without an uncaught exception'});
}
const status = failed === 0 ? 'PASS' : 'FAIL';
window.__PHYSICS_ACCEPTANCE__ = {
  status, passed, failed, backend, rapierReady, errors,
  assertions: assertions.map(a => ({...a})),
  browser: { userAgent: navigator.userAgent },
  rapierCounts: window.FumocaPhysics?.getRuntimeCounts?.() || null,
};
out.textContent = JSON.stringify(window.__PHYSICS_ACCEPTANCE__, null, 2);
</script>
</body>
</html>
