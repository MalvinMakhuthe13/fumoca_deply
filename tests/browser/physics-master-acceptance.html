<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>FUMOCA Physics Master Acceptance</title>
<script type="importmap">{"imports":{"@dimforge/rapier3d-compat":"https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"}}</script>
<style>
body { font: 13px/1.4 monospace; background: #111; color: #eee; padding: 16px; }
.pass { color: #8f8; } .fail { color: #f66; font-weight: bold; }
</style>
</head>
<body>
<pre id="out">Loading...</pre>
<script type="module">
import '../../js/modules/anim-master.js';
import '../../js/modules/anim-physics.js';
import '../../js/modules/anim-object.js';

const out = document.getElementById('out');
const lines = [];
let failed = 0;
function log(s, ok) {
  const cls = ok === false ? 'fail' : ok === true ? 'pass' : '';
  lines.push(cls ? `<span class="${cls}">${s}</span>` : s);
  if (ok === false) failed++;
  out.innerHTML = lines.join('\n');
}
function assert(cond, msg) { log((cond ? 'PASS: ' : 'FAIL: ') + msg, !!cond); return cond; }

const Physics = window.FumocaPhysics;
const Master = window.FumocaMaster;
const Objects = window.FumocaObjectAnim;

const init = await Physics.initRapier();
log('init: ' + JSON.stringify(init));
assert(init.ok === true, 'Rapier WASM initialized');
assert(Physics.getBackend() === 'rapier', 'Backend is rapier');
assert(Physics.isRapierReady() === true, 'Rapier ready');

const cooler = Objects.createObject('cooler', 'Cooler');
const base = Objects.addComponent('cooler', 'Base', 'transform');
const lid = Objects.addComponent('cooler', 'Lid', 'hinge', base.id);
Objects.setComponentTransform('cooler', lid.id, { x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 0 }, 'closed');
Objects.captureKeyframe('cooler', 0);
Objects.setComponentTransform('cooler', lid.id, { x: 80, y: 0, z: 0 }, { x: 0, y: 0, z: 0 }, 'open');
Objects.captureKeyframe('cooler', 2);

const bottle = Objects.createObject('bottle', 'Bottle');
const body = Objects.addComponent('bottle', 'Body', 'transform');
Objects.setComponentTransform('bottle', body.id, { x: 0, y: 0, z: 0 }, { x: -0.6, y: 0.2, z: 0 });
Objects.captureKeyframe('bottle', 0);
Objects.setComponentTransform('bottle', body.id, { x: 0, y: 0, z: 0 }, { x: 0.1, y: 0.2, z: 0 });
Objects.captureKeyframe('bottle', 2);

Master.addObject(cooler);
Master.addObject(bottle);
Master.setDuration(2);

Physics.createCollider({ id: 'base', type: 'box', bodyType: 'static', halfExtents: { x: 0.4, y: 0.3, z: 0.3 }, owner: { kind: 'component', objectId: 'cooler', componentId: base.id } });
Physics.createCollider({ id: 'lid', type: 'box', bodyType: 'kinematic', halfExtents: { x: 0.4, y: 0.02, z: 0.3 }, localPosition: { x: 0, y: 0.3, z: 0 }, owner: { kind: 'component', objectId: 'cooler', componentId: lid.id } });
Physics.createCollider({ id: 'bottle', type: 'capsule', bodyType: 'kinematic', radius: 0.04, height: 0.2, owner: { kind: 'component', objectId: 'bottle', componentId: body.id } });

assert(Physics.list().length === 3, 'Three colliders registered');
assert(Physics.get('base').bodyType === 'static', 'Base is static');

function poseAt(t) {
  const ev = Master.evaluate(t);
  return {
    overlaps: (ev.physics || []).length,
    lid: Physics.getWorldPose('lid'),
    bottle: Physics.getWorldPose('bottle'),
    base: Physics.getWorldPose('base'),
  };
}

const closed = poseAt(0);
const mid = poseAt(1);
const open = poseAt(2);
const back = poseAt(0);
const forward = poseAt(2);

assert(closed.lid && open.lid, 'Lid poses exist');
assert(Math.abs((open.lid?.quaternion.x || 0) - (closed.lid?.quaternion.x || 0)) > 0.01 || Math.abs((open.lid?.quaternion.w || 1) - (closed.lid?.quaternion.w || 1)) > 0.01, 'Lid rotation changes closed to open');
assert(closed.bottle && Math.abs(closed.bottle.position.x - (-0.6)) < 0.15, 'Bottle starts near -0.6');
assert(open.bottle && Math.abs(open.bottle.position.x - 0.1) < 0.15, 'Bottle ends near 0.1');
assert(back.bottle && closed.bottle && Math.abs(back.bottle.position.x - closed.bottle.position.x) < 0.01, 'Scrub back restores bottle');
assert(forward.bottle && open.bottle && Math.abs(forward.bottle.position.x - open.bottle.position.x) < 0.01, 'Scrub forward restores bottle');
assert(Array.isArray(Master.evaluate(1).physics), 'Query results via master evaluate');
assert(Physics.list().length === 3, 'No duplicate colliders after scrub');

log(failed === 0 ? 'FINAL: PASS' : 'FINAL: FAIL (' + failed + ')', failed === 0);
</script>
</body>
</html>
