# ══════════════════════════════════════════════════════════════════════════════
# DEPRECATED — this file is no longer the R2 storage worker's config.
#
# It used to define a worker called "fumoca-r2-storage" bound to a single
# bucket (R2_BUCKET → fumoca-assets). The worker code has since moved to a
# 5-bucket model (NIF_VIDEOS, NIF_FILES, THUMBNAILS, PREVIEW_VIDEOS, AVATARS)
# and the live worker is "fumoca-r2" — config.js's r2WorkerUrl already points
# at it (https://fumoca-r2.ntuthukochildofkrist.workers.dev).
#
# The real, current config for that worker is now the single file:
#   /wrangler.jsonc   (project root)
#
# This file is kept on disk (not deleted) so nothing that references its path
# breaks, but it intentionally has no "main"/"name"/"r2_buckets" left — running
# `wrangler deploy` from this directory will fail loudly instead of silently
# deploying a worker with the wrong bucket bindings.
#
# The OG-meta worker (social share previews) is unaffected — it already has
# its own standalone config at cloudflare/wrangler-og.toml and was never
# actually deployed from this file.
#
# To deploy the R2 storage worker:
#   cd <project root>
#   wrangler deploy
# ══════════════════════════════════════════════════════════════════════════════
